<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#020617" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#background)"/>
  <circle cx="1460" cy="80" r="300" fill="#0ea5e9" opacity=".1"/>
  <circle cx="90" cy="950" r="270" fill="#8b5cf6" opacity=".12"/>
  <text x="120" y="118" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700">Financial research, grounded in primary sources</text>
  <text x="120" y="165" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="27">Local SQLite retrieval · Amazon Bedrock models · English / Korean / Japanese</text>
  <g filter="url(#shadow)">
    <rect x="120" y="220" width="1360" height="650" rx="22" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <rect x="120" y="220" width="1360" height="66" rx="22" fill="#182235"/>
    <rect x="120" y="264" width="1360" height="22" fill="#182235"/>
    <circle cx="160" cy="253" r="10" fill="#fb7185"/><circle cx="192" cy="253" r="10" fill="#fbbf24"/><circle cx="224" cy="253" r="10" fill="#4ade80"/>
    <text x="270" y="262" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="22">insighta-toolkit — local financial research bot</text>
    <text x="165" y="350" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="26">$ uv run --extra local python -m apps.local.main chat </text>
    <text x="195" y="390" fill="#f8fafc" font-family="ui-monospace, Menlo, monospace" font-size="26">  "Summarize high-urgency PFE events and cite the source URL"</text>
    <text x="165" y="470" fill="#a78bfa" font-family="ui-monospace, Menlo, monospace" font-size="25">Tool #1: retrieve_financial_events</text>
    <text x="165" y="545" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">High-urgency PFE event</text>
    <text x="165" y="598" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="26">Nine pharmaceutical manufacturers signed MFN pricing agreements covering</text>
    <text x="165" y="638" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="26">89% of branded drugs — a material policy change for pharmaceutical revenue.</text>
    <text x="165" y="715" fill="#4ade80" font-family="ui-monospace, Menlo, monospace" font-size="22">Source: whitehouse.gov/fact-sheets/2026/08/...</text>
    <line x1="165" y1="760" x2="1435" y2="760" stroke="#334155"/>
    <text x="165" y="815" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">Sample data indexed locally · Chat and embeddings via Bedrock API</text>
  </g>
  <text x="120" y="940" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="600">Source code and free sample: github.com/insighta-cloud/insighta-toolkit</text>
</svg>
